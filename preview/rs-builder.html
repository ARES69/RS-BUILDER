    <script>

      (function () {
        try {
          var stored = localStorage.getItem('rsb-theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var dark = stored ? stored === 'dark' : !prefersLight;
          document.documentElement.classList.toggle('dark', dark);
          var lang = localStorage.getItem('rsb-locale');
          if (lang) document.documentElement.lang = lang;
        } catch (e) {}
      })();

ет как обычная инструкция."}],mock:"slides",highlights:[{icon:"table",title:{en:"Data-driven charts",ru:"Графики из данных"},text:{en:"CSV, Sheets or a query becomes a real chart.",ru:"CSV, Sheets или запрос превращаются в настоящий график."}},{icon:"presentation",title:{en:"Master layouts",ru:"Мастер-макеты"},text:{en:"Title, section, comparison, quote, appendix — all consistent.",ru:"Титул, секция, сравнение, цитата, приложение — всё единообразно."}},{icon:"fileText",title:{en:"Speaker notes",ru:"Заметки спикера"},text:{en:"Written to be read aloud, timed per slide.",ru:"Написаны так, чтобы их читали вслух, с таймингом на слайд."}},{icon:"gitBranch",title:{en:"PPTX / PDF / web",ru:"PPTX / PDF / web"},text:{en:"Take the format your audience actually opens.",ru:"Формат, который ваша аудитория реально открывает."}}],useCases:[{en:"Board and investor updates from raw metrics",ru:"Отчёты для совета и инвесторов из сырых метрик"},{en:"Sales decks tailored per prospect",ru:"Продающие презентации под каждого клиента"},{en:"Conference talks and internal training",ru:"Доклады на конференции и внутреннее обучение"},{en:"Weekly team recaps pulled from Linear and Slack",ru:"Еженедельные сводки команды из Linear и Slack"}],related:["deep-research","design","webapp"],minPlan:"starter",metric:{value:"14",label:{en:"slides produced per run on average",ru:"слайдов в среднем за один запуск"}}},{slug:"deep-research",icon:"microscope",title:{en:"Deep research",ru:"Глубокое исследование"},tagline:{en:"Dozens of sources read, cross-checked and cited — delivered as a structured report.",ru:"Десятки источников прочитаны, сверены и процитированы — на выходе структурированный отчёт."},lead:{en:"The agent plans a research strategy, browses, reads long documents, extracts numbers into tables, checks conflicting claims against each other and writes it all up with an inline citation on every assertion.",ru:"Агент планирует стратегию исследования, работает в браузере, читает длинные документы, выносит цифры в таблицы, сверяет противоречащие утверждения и оформляет всё с цитатой на каждое заявление."},body:[{en:'Intermediate findings are visible while the run is going, so you can redirect it — "skip the pricing section, go deeper on regulation" — without throwing the work away.',ru:"Промежуточные находки видны прямо во время запуска, поэтому можно менять направление — «пропусти раздел с ценами, копай глубже в регулирование» — не теряя сделанное."},{en:"Outputs come as a report, a spreadsheet of extracted data and a source list, each individually downloadable.",ru:"Результат — отчёт, таблица с извлечёнными данными и список источников; каждый файл скачивается отдельно."}],mock:"report",highlights:[{icon:"compass",title:{en:"Real browsing",ru:"Настоящий браузер"},text:{en:"Reads paywalled and JS-heavy pages inside a logged-in session.",ru:"Читает страницы под пейволом и с JS внутри сессии с логином."}},{icon:"shield",title:{en:"Every claim cited",ru:"Каждое утверждение с цитатой"},text:{en:"Inline references you can audit in one click.",ru:"Встроенные ссылки, которые проверяются в один клик."}},{icon:"table",title:{en:"Structured extraction",ru:"Структурированное извлечение"},text:{en:"Numbers land in tables, not buried in prose.",ru:"Цифры попадают в таблицы, а не тонут в тексте."}},{icon:"fileText",title:{en:"Long-form output",ru:"Длинный формат"},text:{en:"20–60 page reports with an executive summary up top.",ru:"Отчёты на 20–60 страниц с саммари в начале."}}],useCases:[{en:"Market and competitor scans before a launch",ru:"Сканирование рынка и конкурентов перед запуском"},{en:"Due diligence on vendors, tools and suppliers",ru:"Проверка вендоров, инструментов и поставщиков"},{en:"Regulatory landscape mapping",ru:"Карта регуляторного ландшафта"},{en:"Literature and patent reviews",ru:"Обзоры литературы и патентов"}],related:["wide-research","slides","automations"],minPlan:"starter",metric:{value:"60+",label:{en:"sources read per deep research run",ru:"источников читается за одно исследование"}}},{slug:"wide-research",icon:"network",badge:"new",title:{en:"Wide Research",ru:"Wide Research"},tagline:{en:"Send a fleet of sub-agents at a question too big for one thread.",ru:"Отправьте флот суб-агентов на вопрос, который не влезает в одну ветку."},lead:{en:"The coordinator splits the problem — 40 competitors, 30 regions, 25 papers — assigns one sub-agent per slice, runs them in parallel and then merges the results into a single deduplicated, sourced deliverable.",ru:"Координатор делит задачу — 40 конкурентов, 30 регионов, 25 статей — назначает по суб-агенту на срез, запускает их параллельно и сводит результаты в один дедуплицированный документ с источниками."},body:[{en:"You see the fleet: each sub-agent has its own row in the run view with live status, sources visited and partial findings.",ru:"Флот видно целиком: у каждого суб-агента своя строка в окне запуска со статусом, посещёнными источниками и частичными находками."},{en:"Merging is not concatenation. Contradictions are flagged, duplicates collapsed and gaps listed explicitly at the end of the report.",ru:"Сведение — это не склейка. Противоречия помечаются, дубли схлопываются, а пробелы явно перечисляются в конце отчёта."}],mock:"fleet",highlights:[{icon:"network",title:{en:"Up to 40 sub-agents",ru:"До 40 суб-агентов"},text:{en:"Scale the fleet to the size of the question.",ru:"Масштаб флота под размер вопроса."}},{icon:"bolt",title:{en:"Parallel, not sequential",ru:"Параллельно, а не последовательно"},text:{en:"A 10-hour job finishes in about 20 minutes.",ru:"Десятичасовая работа занимает около 20 минут."}},{icon:"shield",title:{en:"Conflict detection",ru:"Поиск противоречий"},text:{en:"Disagreements between sources are surfaced, not smoothed over.",ru:"Расхождения между источниками показываются, а не сглаживаются."}},{icon:"table",title:{en:"One merged matrix",ru:"Единая матрица"},text:{en:"Every slice lands in the same comparison table.",ru:"Каждый срез попадает в одну сравнительную таблицу."}}],useCases:[{en:"Landscape mapping of a whole market segment",ru:"Карта целого сегмента рынка"},{en:"Multi-region compliance and pricing checks",ru:"Проверка комплаенса и цен по нескольким регионам"},{en:"Large literature or patent sweeps",ru:"Массовые обзоры литературы и патентов"},{en:"Auditing hundreds of pages or listings",ru:"Аудит сотен страниц или объявлений"}],related:["deep-research","automations","browser-operator"],minPlan:"pro",metric:{value:"40",label:{en:"sub-agents running in parallel",ru:"суб-агентов, работающих параллельно"}}},{slug:"games",icon:"gamepad",badge:"new",title:{en:"Game development",ru:"Разработка игр"},tagline:{en:"Playable HTML5 builds with art, sound, juice and a tuning pass.",ru:"Играбельные HTML5-сборки с артом, звуком, «сочностью» и проходом по балансу."},lead:{en:"The agent writes the game loop, generates sprites and audio, wires input, adds the feel — screenshake, particles, easing — then plays the build itself to check that it is not broken or unfair.",ru:"Агент пишет игровой цикл, генерирует спрайты и звук, подключает ввод, добавляет ощущения — тряску экрана, частицы, плавность — а затем сам проходит сборку, чтобы убедиться, что она не сломана и не нечестна."},body:[{en:"Everything runs in the browser: no engine install, no build farm. The result is a folder you can host anywhere, plus the source for further edits.",ru:"Всё работает в браузере: без установки движка и билд-ферм. Результат — папка, которую можно захостить где угодно, плюс исходники для дальнейших правок."},{en:'Iterate by feel: "make the jump floatier", "double the spawn rate after 30 seconds", "add a combo multiplier".',ru:"Итерируйте по ощущениям: «сделай прыжок более воздушным», «удвой частоту спавна после 30 секунд», «добавь множитель комбо»."}],mock:"game",highlights:[{icon:"gamepad",title:{en:"Instantly playable",ru:"Сразу играбельно"},text:{en:"Runs in an iframe the moment the build finishes.",ru:"Запускается во фрейме сразу после окончания сборки."}},{icon:"palette",title:{en:"Generated art",ru:"Сгенерированный арт"},text:{en:"Sprites, tilesets and UI in a single visual style.",ru:"Спрайты, тайлсеты и UI в едином визуальном стиле."}},{icon:"bolt",title:{en:"Game feel pass",ru:"Проход по game feel"},text:{en:"Particles, shake, easing and audio feedback by default.",ru:"Частицы, тряска, плавность и звуковой отклик по умолчанию."}},{icon:"gitBranch",title:{en:"Balance tuning",ru:"Настройка баланса"},text:{en:"Difficulty curves adjusted from actual playtests.",ru:"Кривые сложности правятся по результатам реальных плейтестов."}}],useCases:[{en:"Game jam entries and weekend experiments",ru:"Участие в геймджемах и эксперименты на выходных"},{en:"Playable demos for pitch decks",ru:"Играбельные демо для питч-деков"},{en:"Educational mini-games and quizzes",ru:"Обучающие мини-игры и квизы"},{en:"Marketing microgames for a campaign",ru:"Маркетинговые микроигры для кампании"}],related:["video","design","webapp"],minPlan:"pro",metric:{value:"9m 33s",label:{en:"from prompt to a playable build",ru:"от промпта до играбельной сборки"}}},{slug:"video",icon:"clapperboard",badge:"beta",title:{en:"Video & editor",ru:"Видео и редактор"},tagline:{en:"Generate shots, cut a timeline, caption it, export it.",ru:"Генерация кадров, монтаж таймлайна, субтитры и экспорт."},lead:{en:"Upload raw footage or generate clips from text. The agent builds a timeline, trims silence, adds kinetic captions, lays in music, grades the colour and exports in the aspect ratio you need.",ru:"Загрузите исходники или сгенерируйте клипы из текста. Агент собирает таймлайн, режет тишину, добавляет кинетические субтитры, кладёт музыку, красит цвет и экспортирует в нужном соотношении сторон."},body:[{en:'The timeline stays editable: request "cut it to 30 seconds, open on the product shot" and the agent re-cuts rather than re-rendering from scratch.',ru:"Таймлайн остаётся редактируемым: попросите «сократи до 30 секунд, начни с кадра продукта» — агент перемонтирует, а не рендерит заново."},{en:"Captions are transcribed and timed, then styled to match the brand; SRT and burned-in variants are both exported.",ru:"Субтитры расшифровываются и размечаются по времени, затем стилизуются под бренд; экспортируются и SRT, и вжжённый вариант."}],mock:"video",highlights:[{icon:"clapperboard",title:{en:"Text to shot",ru:"Текст в кадр"},text:{en:"Generate b-roll when you did not shoot it.",ru:"Генерация b-roll, если вы его не сняли."}},{icon:"bolt",title:{en:"Auto-cut",ru:"Авто-монтаж"},text:{en:"Silence removal and beat-matched transitions.",ru:"Удаление тишины и переходы в такт музыке."}},{icon:"fileText",title:{en:"Captions & SRT",ru:"Субтитры и SRT"},text:{en:"Transcribed, timed, brand-styled.",ru:"Расшифровка, тайминг, стиль бренда."}},{icon:"globe",title:{en:"Any aspect ratio",ru:"Любое соотношение сторон"},text:{en:"16:9, 9:16 and 1:1 from the same timeline.",ru:"16:9, 9:16 и 1:1 из одного таймлайна."}}],useCases:[{en:"Launch teasers and social cutdowns",ru:"Тизеры запуска и нарезки для соцсетей"},{en:"Turning webinars into short clips",ru:"Нарезка вебинаров на короткие клипы"},{en:"Product demos with voiceover",ru:"Продуктовые демо с озвучкой"},{en:"Recaps of events and conferences",ru:"Обзоры событий и конференций"}],related:["design","slides","games"],minPlan:"pro",metric:{value:"30s",label:{en:"teaser cut and captioned in one run",ru:"тизер, смонтированный и с субтитрами за один запуск"}}},{slug:"design",icon:"palette",title:{en:"Design & images",ru:"Дизайн и изображения"},tagline:{en:"Brand-consistent visuals, UI mockups and precise image edits from plain instructions.",ru:"Визуалы в стиле бренда, UI-макеты и точечные правки изображений по обычным инструкциям."},lead:{en:"Upload a brand kit or let the agent infer one. It then produces imagery, icons, UI screens and marketing assets that all share the same palette, grid and type treatment.",ru:"Загрузите бренд-кит или позвольте агенту вывести его самому. Дальше он делает изображения, иконки, экраны UI и маркетинговые материалы в единой палитре, сетке и типографике."},body:[{en:'Edits are surgical: "remove the person on the left, keep the lighting" runs as a targeted operation with the original preserved.',ru:"Правки точечные: «убери человека слева, свет оставь» выполняется как целевая операция с сохранением оригинала."},{en:"Every asset exports in the sizes you need — OG images, app icons, social crops, print bleed — with a naming convention you set.",ru:"Каждый ассет экспортируется в нужных размерах — OG-картинки, иконки приложения, кропы для соцсетей, печать с вылетами — по заданной схеме имён."}],mock:"design",highlights:[{icon:"palette",title:{en:"Brand memory",ru:"Память о бренде"},text:{en:"Palette and type persist across every run.",ru:"Палитра и типографика сохраняются между запусками."}},{icon:"sparkles",title:{en:"Batch variants",ru:"Пакет вариантов"},text:{en:"Ten directions in one pass, pick and refine.",ru:"Десять направлений за один проход — выбирайте и дорабатывайте."}},{icon:"fileText",title:{en:"Export specs",ru:"Спецификации экспорта"},text:{en:"SVG, PNG, WebP and PDF with correct sizing.",ru:"SVG, PNG, WebP и PDF с корректными размерами."}},{icon:"gitBranch",title:{en:"Layered sources",ru:"Слоистые исходники"},text:{en:"Editable structure, not flattened bitmaps only.",ru:"Редактируемая структура, а не только плоские битмапы."}}],useCases:[{en:"Campaign creative in many formats at once",ru:"Креативы кампании сразу во многих форматах"},{en:"Icon sets and illustration systems",ru:"Наборы иконок и системы иллюстраций"},{en:"UI screens for a prototype",ru:"Экраны UI для прототипа"},{en:"Cleaning and retouching product photos",ru:"Чистка и ретушь продуктовых фото"}],related:["webapp","video","slides"],minPlan:"starter",metric:{value:"10",label:{en:"design directions generated per pass",ru:"направлений дизайна за один проход"}}},{slug:"browser-operator",icon:"compass",badge:"beta",title:{en:"Browser operator",ru:"Браузер-оператор"},tagline:{en:"A real browser session the agent drives: clicks, forms, logins, scraping.",ru:"Настоящая браузерная сессия, которой управляет агент: клики, формы, логины, скрейпинг."},lead:{en:"When the work lives behind a login or inside a web app with no API, the agent operates the browser like a person does — navigating, filling forms, waiting for content, handling popups, and taking screenshots as evidence.",ru:"Когда работа живёт за логином или в веб-приложении без API, агент управляет браузером как человек: навигация, заполнение форм, ожидание контента, обработка попапов и скриншоты как подтверждение."},body:[{en:"You can watch every action replayed step by step, and credentials stay in your session — the agent never stores them in the transcript.",ru:"Каждое действие можно просмотреть по шагам, а учётные данные остаются в вашей сессии — в транскрипт агент их не пишет."},{en:"Combine with automations to run the same browser flow on a schedule: check a dashboard, export a report, file the result.",ru:"В связке с автоматизациями тот же браузерный сценарий можно запускать по расписанию: проверить дашборд, выгрузить отчёт, разложить результат."}],mock:"browser",highlights:[{icon:"compass",title:{en:"Session reuse",ru:"Переиспользование сессии"},text:{en:"Log in once, reuse the session across runs.",ru:"Залогиньтесь один раз и используйте сессию в разных запусках."}},{icon:"shield",title:{en:"Secrets stay local",ru:"Секреты остаются локально"},text:{en:"Credentials are masked in logs and artifacts.",ru:"Учётные данные маскируются в логах и артефактах."}},{icon:"fileText",title:{en:"Evidence trail",ru:"Цепочка доказательств"},text:{en:"Screenshots and DOM snapshots per action.",ru:"Скриншоты и снапшоты DOM на каждое действие."}},{icon:"bolt",title:{en:"Retry logic",ru:"Логика повторов"},text:{en:"Handles popups, captchas prompts and slow loads.",ru:"Справляется с попапами, запросами капчи и медленной загрузкой."}}],useCases:[{en:"Portals and legacy tools with no API",ru:"Порталы и легаси-инструменты без API"},{en:"Repetitive form filling and data entry",ru:"Однообразное заполнение форм и ввод данных"},{en:"Competitor price monitoring behind logins",ru:"Мониторинг цен конкурентов за логином"},{en:"Verifying that a deployed site actually works",ru:"Проверка, что задеплоенный сайт действительно работает"}],related:["automations","deep-research","wide-research"],minPlan:"starter",metric:{value:"100%",label:{en:"of actions replayable from the log",ru:"действий воспроизводятся из лога"}}},{slug:"automations",icon:"calendar",badge:"beta",title:{en:"Automations",ru:"Автоматизации"},tagline:{en:"Schedule any task and route the result where your team already reads.",ru:"Запланируйте любую задачу и доставляйте результат туда, где команда уже читает."},lead:{en:"Turn any successful run into a recurring job: daily, weekly, monthly or on a webhook. The agent re-executes the whole flow with fresh data and delivers the output to email, Slack, Drive, Notion or your API endpoint.",ru:"Превратите любой удачный запуск в повторяющуюся задачу: ежедневно, еженедельно, ежемесячно или по вебхуку. Агент заново выполняет весь поток на свежих данных и доставляет результат в почту, Slack, Drive, Notion или на ваш API-эндпоинт."},body:[{en:'Runs are diff-aware: if nothing meaningful changed, you get a one-line "no changes" instead of another full report.',ru:"Запуски учитывают различия: если ничего значимого не изменилось, вы получите одну строку «без изменений» вместо ещё одного полного отчёта."},{en:"Every scheduled job has its own history, cost report and alerting threshold, so a runaway task cannot quietly burn credits.",ru:"У каждой запланированной задачи своя история, отчёт по затратам и порог оповещений, поэтому вышедшая из-под контроля задача не сможет незаметно сжечь кредиты."}],mock:"schedule",highlights:[{icon:"calendar",title:{en:"Cron or natural language",ru:"Cron или обычный язык"},text:{en:'"Every Monday 08:00 CET" i <html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ember &amp; Oak — single-origin coffee, on repeat</title>
<style>
:root{--paper:#f7f2ea;--card:#fffdf9;--ink:#241c15;--muted:#7a6a5b;--ember:#c2571b;--leaf:#5d7a4a;--line:rgba(36,28,21,.14)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.62 ui-serif,Georgia,'Times New Roman',serif}
h1,h2,h3,.sans{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:0 22px}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--line)}
.mark{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ember);box-shadow:0 0 0 4px rgba(194,87,27,.16)}
nav a{margin-left:20px;color:var(--muted);text-decoration:none;font-size:14px}
.btn{display:inline-block;background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:999px;text-decoration:none;font:600 14px/1 ui-sans-serif,system-ui,sans-serif;border:0;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.hero{padding:74px 0 56px;display:grid;gap:18px}
.eyebrow{font:600 12px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--ember)}
h1{font-size:clamp(38px,6.4vw,68px);line-height:1.02;letter-spacing:-.035em;margin:0;max-width:16ch}
.lede{font-size:19px;color:var(--muted);max-width:52ch;margin:0}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.beans{display:flex;gap:8px;margin-top:26px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font:500 12.5px/1 ui-sans-serif,system-ui,sans-serif;color:var(--muted)}
section{padding:52px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(26px,3.4vw,36px);letter-spacing:-.03em;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 28px;max-width:56ch}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.plan{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:10px}
.plan.best{border-color:var(--ink);box-shadow:0 18px 40px -28px rgba(36,28,21,.6)}
.price{font:800 34px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:-.03em}
.price span{font:500 13px/1 ui-sans-serif,system-ui,sans-serif;color:var(--muted);letter-spacing:0}
ul{margin:0;padding-left:18px;color:var(--muted);font-size:14.5px}
li{margin:5px 0}
.tag{align-self:flex-start;background:rgba(93,122,74,.14);color:var(--leaf);border-radius:999px;padding:4px 10px;font:600 11px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}
details{border-bottom:1px solid var(--line);padding:14px 0}
summary{cursor:pointer;font:600 16px/1.4 ui-sans-serif,system-ui,sans-serif}
details p{color:var(--muted);margin:10px 0 0;font-size:15px}
footer{border-top:1px solid var(--line);padding:28px 0 46px;color:var(--muted);font-size:13.5px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.stat{display:flex;gap:26px;flex-wrap:wrap;margin-top:6px}
.stat div{font:600 13px/1.5 ui-sans-serif,system-ui,sans-serif;color:var(--muted)}
.stat b{display:block;font-size:24px;color:var(--ink);letter-spacing:-.02em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark"><span class="dot"></span> Ember &amp; Oak</div>
    <nav class="sans">
      <a href="#plans">Plans</a><a href="#how">How it works</a><a href="#faq">FAQ</a>
      <a class="btn" href="#plans" style="margin-left:20px">Start a subscription</a>
    </nav>
  </header>

  <div class="hero">
    <span class="eyebrow">Roasted to order · shipped within 48h</span>
    <h1>One origin at a time, until you have tasted them all.</h1>
    <p class="lede">A rotating subscription of single-origin lots from smallholder farms. We roast the day your box ships, and we tell you exactly who grew it.</p>
    <div class="actions"><a class="btn" href="#plans">Choose a plan</a><a class="btn alt" href="#how">How it works</a></div>
    <div class="beans">
      <span class="chip">Ethiopia · Guji</span><span class="chip">Colombia · Huila</span>
      <span class="chip">Kenya · Nyeri</span><span class="chip">Peru · Cajamarca</span>
    </div>
  </div>

  <section id="plans">
    <h2>Plans</h2>
    <p class="sub">Pause, skip or swap any week. Every plan includes tasting notes and the farmer's story.</p>
    <div class="grid">
      <div class="plan">
        <span class="tag">Solo</span>
        <div class="price">14€ <span>/ month</span></div>
        <p class="sub" style="margin:0">250 g, one origin, every month.</p>
        <ul><li>Whole bean or ground</li><li>Free shipping over 20€</li><li>Cancel anytime</li></ul>

  <h1>AI coding tools sold into the EU: landscape, pricing and compliance gaps</h1>
  <div class="meta">Prepared by RS-BUILDER · run time 21m 05s · 1,840 credits · 40 vendors profiled, 32 in scope for the EU market</div>

  <div class="callout">
    <strong>Executive summary.</strong> The EU-facing AI coding market splits into three groups: editor copilots competing on price, autonomous agents competing on task completion, and compliance-first platforms selling to regulated industries. Group three is the least crowded and carries the highest average contract value. Four concrete gaps are listed in section 5.

  <h2>1. Scope and method</h2>
  <p>Thirty-two sub-agents each profiled one to two vendors using public pricing pages, documentation, EU customer references, procurement notices and, where available, published SOC 2 / ISO 27001 summaries. A second pass cross-checked every pricing claim against a live page visit; nine vendors had changed pricing in the previous 60 days.<sup><a href="#r4">4</a></sup></p>

  <h2>5. Identified gaps</h2>
  <ol>
    <li><strong>Regulated mid-market.</strong> Banks under 5,000 employees and public health bodies want EU residency plus SSO without a 40k€ contract. Only two vendors serve this band credibly.</li>

top it at any point.",ru:"Кредит — единица вычислений агента. Короткая задача с документом может стоить 40 кредитов, полноценная сборка сайта — 300–400, а запуск Wide Research на 40 агентов — пару тысяч. Итог виден по ходу выполнения, и задачу можно остановить в любой момент."}},{q:{en:"How is this different from a chat assistant?",ru:"Чем это отличается от чат-ассистента?"},a:{en:"A chat assistant replies. RS-BUILDER executes: it opens a browser session, writes and runs code in a sandbox, produces files and returns a deliverable you can open, download or deploy. The transcript is a by-product, not the output.",ru:"Чат-ассистент отвечает. RS-BUILDER выполняет: открывает браузерную сессию, пишет и запускает код в песочнице, создаёт файлы и возвращает артефакт, который можно открыть, скачать или задеплоить. Переписка — побочный продукт, а не результат."}},{q:{en:"Can I steer a run while it is in progress?",ru:"Можно ли управлять запуском во время выполнения?"},a:{en:"Yes. The plan is editable mid-run: reorder steps, delete one, add a constraint, or send a message and the agent folds it into the current work instead of starting over.",ru:"Да. План редактируется по ходу: можно поменять порядок шагов, удалить шаг, добавить ограничение или отправить сообщение — агент учтёт это в текущей работе, а не начнёт заново."}},{q:{en:"Do unused credits roll over?",ru:"Сгорают ли неиспользованные кредиты?"},a:{en:"Daily refresh credits reset every 24 hours and do not accumulate. Plan credits stay available for the whole billing cycle; on annual billing they are spread across twelve months.",ru:"Ежедневные refresh-кредиты обнуляются каждые 24 часа и не накапливаются. Плановые кредиты доступны весь биллинговый цикл; при годовой оплате они распределены на двенадцать месяцев."}},{q:{en:"Is my data used to train models?",ru:"Используются ли мои данные для обучения моделей?"},a:{en:"No. Task inputs, files and outputs are not used for model training, and this is stated contractually on Tea )]})}):null,a.jsx(Ar,{})]})}const Gl=[{slug:"introducing-rs-builder-2-0",date:"2026-09-28",readMinutes:6,tags:[{en:"Release",ru:"Релиз"}],title:{en:"Introducing RS-BUILDER 2.0: parallel agents, live preview, scheduled runs",ru:"Представляем RS-BUILDER 2.0: параллельные агенты, живое превью и запуски по расписанию"},excerpt:{en:"The 1.x agent could finish one task at a time while you watched. The 2.0 agent splits the question, runs a fleet, shows the artifact forming in real time, and comes back on a schedule without being asked.",ru:"Агент 1.x умел заканчивать одну задачу за раз, пока вы смотрите. Агент 2.0 делит вопрос на срезы, гоняет флот, показывает артефакт в реальном времени и возвращается по расписанию сам."},author:{name:"RS-BUILDER Team",initials:"RB",role:{en:"Product",ru:"Продукт"}},mock:"fleet",pullquote:{en:"The plan is the interface. Everything else is output.",ru:"План и есть интерфейс. Всё остальное — вывод."},sections:[{heading:{en:"What changed",ru:"Что изменилось"},paragraphs:[{en:"Three capabilities ship together. Wide Research splits one big question into up to forty sub-agent slices that run in parallel and merge into a single sourced report. The preview pane now renders the artifact while the run is still going, so you can redirect it early instead of reviewing a finished thing you did not want. Automations turn any successful run into a recurring job with delivery targets and credit guardrails.",ru:"Три возможности выходят вместе. Wide Research делит большой вопрос на срезы до сорока суб-агентов, которые работают параллельно и сводятся в один отчёт с источниками. Панель превью теперь рендерит артефакт ещё во время запуска — можно развернуть работу рано, а не ревьюить готовое, которое вы не просили. Автоматизации превращают любой удачный запуск в повторяющуюся задачу с каналами доставки и ограничением кредитов."},{en:"Underneath, the run model changed too. Steps are now first-class objects with their own estimate, credit cost and evidence trail, which is what makes mid-run editing and per-step metering possible.",ru:"Под капотом изменилась модель запуска. Шаги стали объектами первого класса со своей оценкой, стоимостью в кредитах и цепочкой доказательств — именно это делает возможной правку на лету и поминутный учёт."}]},{heading:{en:"Why parallel, and why visible",ru:"Почему параллельно и почему видно"},paragraphs:[{en:"Sequential research scales linearly with the size of the question, which means the interesting questions were simply too expensive to ask. Parallelism fixes the cost; visibility fixes the trust. A fleet you cannot inspect is a black box with extra steps, so every sub-agent gets its own row: status, sources visited, partial findings.",ru:"Последовательное исследование масштабируется линейно с размером вопроса, то есть интересные вопросы было просто слишком дорого задавать. Параллелизм чинит стоимость; видимость чинит доверие. Флот, который нельзя осмотреть, — это чёрный ящик с лишними шагами, поэтому у каждого суб-агента своя строка: статус, посещённые источники, частичные находки."}]},{heading:{en:"Rollout",ru:"Доступность"},paragraphs:[{en:"Wide Research is on Pro and above, with five sub-agents on Starter so everyone can feel the shape of it. Automations and live preview are on every plan, including free. Scheduled runs on Max and Team are unlimited, capped only by the per-job credit guardrail you set.",ru:"Wide Research доступен с тарифа Pro, при этом на Starter есть пять суб-агентов, чтобы каждый почувствовал форму возможности. Автоматизации и живое превью — на всех тарифах, включая бесплатный. Запуски по расписанию на Max и Team безлимитны и ограничены лишь лимитом кредитов на задачу, который задаёте вы."}]}]},{slug:"the-plan-is-the-interface",date:"2026-08-14",readMinutes:5,tags:[{en:"Design",ru:"Дизайн"},{en:"Research",ru:"Исследование"}],title:{en:"The plan is the interface: why we made the todo list editable mid-run",ru:"План и есть интерфейс: почему список задач редактируется прямо во время запуска"},excerpt:{en:"Most agent UIs hide the reasoning and show you a spinner. We did the opposite, and the support tickets told us it was the right call.",ru:"Большинство агентских интерфейсов прячут рассуждения и показывают спиннер. Мы сделали наоборот — и тикеты в поддержку подтвердили, что это было верное решение."},author:{name:"P. Adeyemi",initials:"PA",role:{en:"Head of Design",ru:"Руководитель дизайна"}},mock:"browser",pullquote:{en:"A spinner asks for faith. A plan asks for a decision.",ru:"Спиннер просит веры. План просит решения."},sections:[{heading:{en:"The problem with spinners",ru:"Проблема спиннеров"},paragraphs:[{en:"When the interface between you and a long-running agent is a spinner, the only control you have is cancellation. People do not want to cancel; they want to correct. In our first usability sessions, eleven of fourteen participants tried to click on the reasoning trace to change it.",ru:"Когда интерфейс между вами и долгим запуском — это спиннер, единственный доступный контроль — отмена. Люди не хотят отменять; они хотят поправить. В первых юзабилити-сессиях одиннадцать из четырнадцати участников пытались кликнуть по трассировке рассуждений, чтобы изменить её."}]},{heading:{en:"Editable plans changed the conversation",ru:"Редактируемый план изменил разговор"},paragraphs:[{en:'Once steps became objects with cost and evidence, we could expose three operations safely: reorder, delete, constrain. Users stopped writing defensive prompts ("and make sure you also…") because the plan itself became the place to say it. Prompt length dropped 34% in the first month after launch.',ru:"Когда шаги стали объектами со стоимостью и доказательствами, мы смогли безопасно дать три операции: поменять порядок, удалить, добавить ограничение. Пользователи перестали писать оборонительные промпты («и обязательно ещё…»), потому что план сам стал местом, где это говорится. Средняя длина промпта упала на 34% за первый месяц после запуска."},{en:"The second effect was emotional. Watching a checklist tick forward converts waiting into supervising, and supervising feels like work you chose rather than latency you endure.",ru:"Второй эффект — эмоциональный. Наблюдать, как отметки бегут по чек-листу, — значит превратить ожидание в супервизию, а супервизия ощущается как работа, которую вы выбрали, а не как задержка, которую терпите."}]},{heading:{en:"What we deliberately did not build",ru:"Что мы сознательно не стали строить"},paragraphs:[{en:"No Gantt charts, no dependencies graph, no manual step authoring from scratch. The agent proposes; you adjust. The moment a user has to write the plan themselves, the product has failed at its only job.",ru:"Никаких диаграмм Ганта, графов зависимостей и ручного написания плана с нуля. Агент предлагает — вы правите. В момент, когда пользователь вынужден писать план сам, продукт провалился в своей единственной работе."}]}]},{slug:"credits-explained",date:"2026-07-02",readMinutes:4,tags:[{en:"Pricing",ru:"Тарифы"}],title:{en:"Credits, explained: what you are actually paying for",ru:"Кредиты, объяснённые: за что вы на самом деле платите"},excerpt:{en:"Seat pricing charges you for presence. Credit pricing charges you for work done. Here is how we set the numbers, and where the meter runs.",ru:"Оплата за места берёт деньги за присутствие. Оплата кредитами — за выполненную работу. Вот как мы выставили цифры и где крутится счётчик."},author:{name:"RS-BUILDER Team",initials:"RB",role:{en:"Product",ru:"Продукт"}},mock:"schedule",pullquote:{en:"You should be able to predict the invoice from the run log.",ru:"Счёт должен предсказуемо выводиться из лога запуска."},sections:[{heading:{en:"One unit, one thing",ru:"Одна единица — одна вещь"},paragraphs:[{en:"A credit is a unit of agent compute: model tokens plus sandbox seconds plus browser sessions. We priced it so that a short document task lands around 40 credits, a full landing page around 300–400, and a forty-slice Wide Research run in the low thousands. The run log shows the running total per step, so the invoice is never a surprise.",ru:"Кредит — это единица вычислений агента: токены модели плюс секунды песочницы плюс браузерные сессии. Мы выставили цену так, чтобы короткая задача с документом стоила около 40 кредитов, полноценный лендинг — 300–400, а Wide Research на сорок срезов — несколько тысяч. Лог запуска показывает нарастающий итог по шагам, поэтому счёт никогда не становится сюрпризом."}]},{heading:{en:"Refresh credits are the free lunch, on purpose",ru:"Refresh-кредиты — сознательный бесплатный обед"},paragraphs:[{en:"Every account gets 300 refresh credits a day, on every plan including free. They do not accumulate, and that is deliberate: the point is that the agent is useful today, not that you hoard a balance. Plan credits are the ones that roll with your billing cycle.",ru:"Каждый аккаунт получает 300 refresh-кредитов в день на всех тарифах, включая бесплатный. Они не накапливаются, и это сознательно: смысл в том, что агент полезен сегодня, а не в том, что вы копите баланс. Плановые кредиты — те, что живут в рамках биллингового цикла."}]},{heading:{en:"Failed runs",ru:"Неудачные запуски"},paragraphs:[{en:"If a run cannot finish, the credits for the unfinished portion are returned automatically and the partial artifacts stay available. You pay for work the agent actually did, not for its optimism.",ru:"Если запуск не может завершиться, кредиты за незавершённую часть возвращаются автоматически, а частичные артефакты остаются доступны. Вы платите за работу, которую агент реально сделал, а не за его оптимизм."}]}]},{slug:"how-we-handle-your-logins",date:"2026-05-19",readMinutes:5,tags:[{en:"Security",ru:"Безопасность"}],title:{en:"How the browser operator handles your logins",ru:"Как браузер-оператор работает с вашими логинами"},excerpt:{en:"An agent that clicks through your portals needs your sessions. Here is exactly where credentials live, what gets masked, and what never leaves your browser.",ru:"Агенту, который кликает по вашим порталам, нужны ваши сессии. Вот где именно живут учётные данные, что маскируется и что никогда не покидает ваш браузер."},author:{name:"D. Sokolov",initials:"DS",role:{en:"CEO",ru:"CEO"}},mock:"browser",pullquote:{en:"The transcript is evidence, not a keychain.",ru:"Транскрипт — это доказательство, а не связка ключей."},sections:[{heading:{en:"Sessions, not passwords",ru:"Сессии, а не пароли"},paragraphs:[{en:"You log in once inside a browser session that belongs to your account. The agent drives that session; it never sees the password field value, and credential inputs are masked at the driver layer before anything reaches a log, a transcript or an artifact.",ru:"Вы логинитесь один раз в браузерной сессии, которая принадлежит вашему аккаунту. Агент управляет этой сессией; он никогда не видит значение поля пароля, а ввод учётных данных маскируется на уровне драйвера до того, как что-либо попадёт в лог, транскрипт или артефакт."}]},{heading:{en:"Evidence without leakage",ru:"Доказательства без утечек"},paragraphs:[{en:"Every action is recorded with a screenshot and a DOM snapshot so you can replay it. Before storage, the capture pipeline redacts input values, tokens in URLs and anything matching your deny-list patterns. You audit what the agent did without handing it — or us — a second copy of your secrets.",ru:"Каждое действие записывается со скриншотом и снапшотом DOM, чтобы вы могли воспроизвести его. Перед сохранением пайплайн скриншотов вычищает значения полей, токены в URL и всё, что совпадает с вашими шаблонами запретов. Вы проверяете, что сделал агент, не передавая ему — и нам — вторую копию ваших секретов."}]},{heading:{en:"Destroyed on completion",ru:"Уничтожается по завершении"},paragraphs:[{en:"The sandbox and its session store are destroyed when the run ends. Scheduled runs create a fresh session each time and prompt you to re-authenticate when the session expires — deliberately, because a forever-session is a forever liability.",ru:"Песочница и её хранилище сессий уничтожаются по завершении запуска. Запуски по расписанию каждый раз создают свежую сессию и просят вас повторно авторизоваться, когда сессия истекает, — сознательно, потому что вечная сессия есть вечная ответственность."}]}]}],xj=t=>Gl.find(r=>r.slug===t);function Qi({children:t,tone:r="neutral",className:s}){const o={neutral:"bg-surface-2 text-muted border-line",accent:"bg-accent/15 text-accent border-accent/30",violet:"bg-violet/15 text-violet border-violet/30",outline:"bg-transparent text-fg border-line-strong"};return a.jsx("span",{className:$("inline-flex items-center gap-1.5 rounded-full border px-2.5 py-1 text-[11px] font-semibold uppercase tracking-[0.12em]",o[r],s),children:t})}function Jh(t,r){return new Date(t+"T00:00:00Z").toLocaleDateString(r==="ru"?"ru-RU":"en-GB",{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"})}function yj({slug:t,date:r,readMinutes:s,tags:o,title:c,excerpt:u,author:p,mock:h}){const{l:m,locale:g}=le();return a.jsxs(_e,{to:"/blog/"+t,className:"group flex h-full flex-col overflow-hidden rounded-2xl border border-line bg-surface/60 transition-all duration-300 hover:-translate-y-1 hover:border-accent/35",children:[a.jsx("div",{className:"relative overflow-hidden border-b border-line bg-bg-elev p-4",children:a.jsx("div",{className:"transition-transform duration-500 group-hover:scale-[1.02]",children:a.jsx(Ct,{kind:h,animate:!1})})}),a.jsxs("div",{className:"flex flex-1 flex-col p-5",children:[a.jsxs("div",{className:"flex flex-wrap items-center gap-2",children:[o.map(x=>a.jsx(Qi,{tone:"accent",children:m(x)},x.en)),a.jsxs("span",{className:"ml-auto inline-flex items-center gap-1.5 font-mono text-[11px] text-faint",children:[a.jsx(Po,{size:11})," ",s," min"]})]}),a.jsx("h3",{className:"mt-3 text-[16.5px] font-bold leading-snug tracking-[-0.02em] text-fg transition-colors group-hover:text-accent",children:m(c)}),a.jsx("p",{className:"mt-2 line-clamp-3 text-[13.5px] leadi
