    <script>
      // Apply persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('rsb-theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var dark = stored ? stored === 'dark' : !prefersLight;
          document.documentElement.classList.toggle('dark', dark);
          var lang = localStorage.getItem('rsb-locale');
          if (lang) document.documentElement.lang = lang;
        } catch (e) {}
      })();
    </script>

 читается за одно исследование"}}},{slug:"wide-research",icon:"network",badge:"new",title:{en:"Wide Research",ru:"Wide Research"},tagline:{en:"Send a fleet of sub-agents at a question too big for one thread.",ru:"Отправьте флот суб-агентов на вопрос, который не влезает в одну ветку."},lead:{en:"The coordinator splits the problem — 40 competitors, 30 regions, 25 papers — assigns one sub-agent per slice, runs them in parallel and then merges the results into a single deduplicated, sourced deliverable.",ru:"Координатор делит задачу — 40 конкурентов, 30 регионов, 25 статей — назначает по суб-агенту на срез, запускает их параллельно и сводит результаты в один дедуплицированный документ с источниками."},body:[{en:"You see the fleet: each sub-agent has its own row in the run view with live status, sources visited and partial findings.",ru:"Флот видно целиком: у каждого суб-агента своя строка в окне запуска со статусом, посещёнными источниками и частичными находками."},{en:"Merging is not concatenation. Contradictions are flagged, duplicates collapsed and gaps listed explicitly at the end of the report.",ru:"Сведение — это не склейка. Противоречия помечаются, дубли схлопываются, а пробелы явно перечисляются в конце отчёта."}],mock:"fleet",highlights:[{icon:"network",title:{en:"Up to 40 sub-agents",ru:"До 40 суб-агентов"},text:{en:"Scale the fleet to the size of the question.",ru:"Масштаб флота под размер вопроса."}},{icon:"bolt",title:{en:"Parallel, not sequential",ru:"Параллельно, а не последовательно"},text:{en:"A 10-hour job finishes in about 20 minutes.",ru:"Десятичасовая работа занимает около 20 минут."}},{icon:"shield",title:{en:"Conflict detection",ru:"Поиск противоречий"},text:{en:"Disagreements between sources are surfaced, not smoothed over.",ru:"Расхождения между источниками показываются, а не сглаживаются."}},{icon:"table",title:{en:"One merged matrix",ru:"Единая матрица"},text:{en:"Every slice lands in the same comparison table.",ru:"Каждый срез попадает в одну е окончания сборки."}},{icon:"palette",title:{en:"Generated art",ru:"Сгенерированный арт"},text:{en:"Sprites, tilesets and UI in a single visual style.",ru:"Спрайты, тайлсеты и UI в едином визуальном стиле."}},{icon:"bolt",title:{en:"Game feel pass",ru:"Проход по game feel"},text:{en:"Particles, shake, easing and audio feedback by default.",ru:"Частицы, тряска, плавность и звуковой отклик по умолчанию."}},{icon:"gitBranch",title:{en:"Balance tuning",ru:"Настройка баланса"},text:{en:"Difficulty curves adjusted from actual playtests.",ru:"Кривые сложности правятся по результатам реальных плейтестов."}}],useCases:[{en:"Game jam entries and weekend experiments",ru:"Участие в геймджемах и эксперименты на выходных"},{en:"Playable demos for pitch decks",ru:"Играбельные демо для питч-деков"},{en:"Educational mini-games and quizzes",ru:"Обучающие мини-игры и квизы"},{en:"Marketing microgames for a campaign",ru:"Маркетинговые микроигры для кампании"}],related:["video","design","webapp"],minPlan:"pro",metric:{value:"9m 33s",label:{en:"from prompt to a playable build",ru:"от промпта до играбельной сборки"}}},{slug:"video",icon:"clapperboard",badge:"beta",title:{en:"Video & editor",ru:"Видео и редактор"},tagline:{en:"Generate shots, cut a timeline, caption it, export it.",ru:"Генерация кадров, монтаж таймлайна, субтитры и экспорт."},lead:{en:"Upload raw footage or generate clips from text. The agent builds a timeline, trims silence, adds kinetic captions, lays in music, grades the colour and exports in the aspect ratio you need.",ru:"Загрузите исходники или сгенерируйте клипы из текста. Агент собирает таймлайн, режет тишину, добавляет кинетические субтитры, кладёт музыку, красит цвет и экспортирует в нужном соотношении сторон."},body:[{en:'The timeline stays editable: request "cut it to 30 seconds, open on the product shot" and the agent re-cuts rather than re-rendering from scratch.',ru:"Таймлайн остаётся редактируемым: попросите «сократи до 30 секунд, начни с кадра продукта» — агент перемонтирует, а не рендерит заново."},{en:"Captions are transcribed and timed, then styled to match the brand; SRT and burned-in variants are both exported.",ru:"Субтитры расшифровываются и размечаются по времени, затем стилизуются под бренд; экспортируются и SRT, и вжжённый вариант."}],mock:"video",highlights:[{icon:"clapperboard",title:{en:"Text to shot",ru:"Текст в кадр"},text:{en:"Generate b-roll when you did not shoot it.",ru:"Генерация b-roll, если вы его не сняли."}},{icon:"bolt",title:{en:"Auto-cut",ru:"Авто-монтаж"},text:{en:"Silence removal and beat-matched transitions.",ru:"Удаление тишины и переходы в такт музыке."}},{icon:"fileText",title:{en:"Captions & SRT",ru:"Субтитры и SRT"},text:{en:"Transcribed, timed, brand-styled.",ru:"Расшифровка, тайминг, стиль бренда."}},{icon:"globe",title:{en:"Any aspect ratio",ru:"Любое соотношение сторон"},text:{en:"16:9, 9:16 and 1:1 from the same timeline.",ru:"16:9, 9:16 и 1:1 из одного таймлайна."}}],useCases:[{en:"Launch teasers and social cutdowns",ru:"Тизеры запуска и нарезки для соцсетей"},{en:"Turning webinars into short clips",ru:"Нарезка вебинаров на короткие клипы"},{en:"Product demos with voiceover",ru:"Продуктовые демо с озвучкой"},{en:"Recaps of events and conferences",ru:"Обзоры событий и конференций"}],related:["design","slides","games"],minPlan:"pro",metric:{value:"30s",label:{en:"teaser cut and captioned in one run",ru:"тизер, смонтированный и с субтитрами за один запуск"}}},{slug:"design",icon:"palette",title:{en:"Design & images",ru:"Дизайн и изображения"},tagline:{en:"Brand-consistent visuals, UI mockups and precise image edits from plain instructions.",ru:"Визуалы в стиле бренда, UI-макеты и точечные правки изображений по обычным инструкциям."},lead:{en:"Upload a brand kit or let the agent infer one. It then produces imagery, icons, UI screens and marketing assets that all share the same palette, grid and type treatment.",ru:"Загрузите бренд-кит или позвольте агенту вывести его самому. Дальше он делает изображения, иконки, экраны UI и маркетинговые материалы в единой палитре, сетке и типографике."},body:[{en:'Edits are surgical: "remove the person on the left, keep the lighting" runs as a targeted operation with the original preserved.',ru:"Правки точечные: «убери человека слева, свет оставь» выполняется как целевая операция с сохранением оригинала."},{en:"Every asset exports in the sizes you need — OG images, app icons, social crops, print bleed — with a naming convention you set.",ru:"Каждый ассет экспортируется в нужных размерах — OG-картинки, иконки приложения, кропы для соцсетей, печать с вылетами — по заданной схеме имён."}],mock:"design",highlights:[{icon:"palette",title:{en:"Brand memory",ru:"Память о бренде"},text:{en:"Palette and type persist across every run.",ru:"Палитра и типографика сохраняются между запусками."}},{icon:"sparkles",title:{en:"Batch variants",ru:"Пакет вариантов"},text:{en:"Ten directions in one pass, pick and refine.",ru:"Десять направлений за один проход — выбирайте и дорабатывайте."}},{icon:"fileText",title:{en:"Export specs",ru:"Спецификации экспорта"},text:{en:"SVG, PNG, WebP and PDF with correct sizing.",ru:"SVG, PNG, WebP и PDF с корректными размерами."}},{icon:"gitBranch",title:{en:"Layered sources",ru:"Слоистые исходники"},text:{en:"Editable structure, not flattened bitmaps only.",ru:"Редактируемая структура, а не только плоские битмапы."}}],useCases:[{en:"Campaign creative in many formats at once",ru:"Креативы кампании сразу во многих форматах"},{en:"Icon sets and illustration systems",ru:"Наборы иконок и системы иллюстраций"},{en:"UI screens for a prototype",ru:"Экраны UI для прототипа"},{en:"Cleaning and retouching product photos",ru:"Чистка и ретушь продуктовых фото"}],related:["webapp","video","slides"],minPlan:"starter",metric:{value:"10",label:{en:"design directions generated per pass",ru:"направлений дизайна за один проход"}}},{slug:"browser-operator",icon:"compass",badge:"beta",title:{en:"Browser operator",ru:"Браузер-оператор"},tagline:{en:"A real browser session the agent drives: clicks, forms, logins, scraping.",ru:"Настоящая браузерная сессия, которой управляет агент: клики, формы, логины, скрейпинг."},lead:{en:"When the work lives behind a login or inside a web app with no API, the agent operates the browser like a person does — navigating, filling forms, waiting for content, handling popups, and taking screenshots as evidence.",ru:"Когда работа живёт за логином или в веб-приложении без API, агент управляет браузером как человек: навигация, заполнение форм, ожидание контента, обработка попапов и скриншоты как подтверждение."},body:[{en:"You can watch every action replayed step by step, and credentials stay in your session — the agent never stores them in the transcript.",ru:"Каждое действие можно просмотреть по шагам, а учётные данные остаются в вашей сессии — в транскрипт агент их не пишет."},{en:"Combine with automations to run the same browser flow on a schedule: check a dashboard, export a report, file the result.",ru:"В связке с автоматизациями тот же браузерный сценарий можно запускать по расписанию: проверить дашборд, выгрузить отчёт, разложить результат."}],mock:"browser",highlights:[{icon:"compass",title:{en:"Session reuse",ru:"Переиспользование сессии"},text:{en:"Log in once, reuse the session across runs.",ru:"Залогиньтесь один раз и используйте сессию в разных запусках."}},{icon:"shield",title:{en:"Secrets stay local",ru:"Секреты остаются локально"},text:{en:"Credentials are masked in logs and artifacts.",ru:"Учётные данные маскируются в логах и артефактах."}},{icon:"fileText",title:{en:"Evidence trail",ru:"Цепочка доказательств"},text:{en:"Screenshots and DOM snapshots per action.",ru:"Скриншоты и снапшоты DOM на каждое действие."}},{icon:"bolt",title:{en:"Retry logic",ru:"Логика повторов"},text:{en:"Handles popups, captchas prompts and slow loads.",ru:"Справляется с попапами, запросами капчи и медленной загрузкой."}}],useCases:[{en:"Portals and legacy tools with no API",ru:"Порталы и легаси-инструменты без API"},{en:"Repetitive form filling and data entry",ru:"Однообразное заполнение форм и ввод данных"},{en:"Competitor price monitoring behind logins",ru:"Мониторинг цен конкурентов за логином"},{en:"Verifying that a deployed site actually works",ru:"Проверка, что задеплоенный сайт действительно работает"}],related:["automations","deep-research","wide-research"],minPlan:"starter",metric:{value:"100%",label:{en:"of actions replayable from the log",ru:"действий воспроизводятся из лога"}}},{slug:"automations",icon:"calendar",badge:"beta",title:{en:"Automations",ru:"Автоматизации"},tagline:{en:"Schedule any task and route the result where your team already reads.",ru:"Запланируйте любую задачу и доставляйте результат туда, где команда уже читает."},lead:{en:"Turn any successful run into a recurring job: daily, weekly, monthly or on a webhook. The agent re-executes the whole flow with fresh data and delivers the output to email, Slack, Drive, Notion or your API endpoint.",ru:"Превратите любой удачный запуск в повторяющуюся задачу: ежедневно, еженедельно, ежемесячно или по вебхуку. Агент заново выполняет весь поток на свежих данных и доставляет результат в почту, Slack, Drive, Notion или на ваш API-эндпоинт."},body:[{en:'Runs are diff-aware: if nothing meaningful changed, you get a one-line "no changes" instead of another full report.',ru:"Запуски учитывают различия: если ничего значимого не изменилось, вы получите одну строку «без изменений» вместо ещё одного полного отчёта."},{en:"Every scheduled job has its own history, cost report and alerting threshold, so a runaway task cannot quietly burn credits.",ru:"У каждой запланированной задачи своя история, отчёт по затратам и порог оповещений, поэтому вышедшая из-под контроля задача не сможет незаметно сжечь кредиты."}],mock:"schedule",highlights:[{icon:"calendar",title:{en:"Cron or natural language",ru:"Cron или обычный язык"},text:{en:'"Every Monday 08:00 CET" is a valid schedule.',ru:"«Каждый понедельник 08:00 CET» — корректное расписание."}},{icon:"mail",title:{en:"Delivery targets",ru:"Каналы доставки"},text:{en:"Email, Slack, Drive, Notion, webhooks, S3.",ru:"Почта, Slack, Drive, Notion, вебхуки, S3."}},{icon:"shield",title:{en:"Budget guardrails",ru:"Ограничение бюджета"},text:{en:"Per-run credit caps and alerts.",ru:"Лимит кредитов на запуск и оповещения."}},{icon:"gitBranch",title:{en:"Diff-aware delivery",ru:"Доставка только изменений"},text:{en:"Silent when nothing changed.",ru:"Молчит, если изменений нет."}}],useCases:[{en:"Morning market and competitor briefs",ru:"Утренние сводки по рынку и конкурентам"},{en:"Weekly board metrics from several sources",ru:"Еженедельные метрики для совета из нескольких источников"},{en:"Invoice, receipt and expense processing",ru:"Обработка счетов, чеков и расходов"},{en:"Uptime and content checks on your properties",ru:"Проверка доступности и контента на ваших ресурсах"}],related:["browser-operator","deep-research","slides"],minPlan:"starter",metric:{value:"∞",label:{en:"scheduled runs on Max and Team",ru:"запусков по расписанию на Max и Team"}}}],Mv=t=>bi.find(r=>r.slug===t);function yn({className:t,accent:r=!0}){return a.jsxs("svg",{viewBox:"0 0 32 32",className:q("h-8 w-8",t),role:"img","aria-label":"RS-BUILDER",children:[a.jsxs("g",{fill:"none",stroke:"currentColor",strokeWidth:3.1,strokeLinecap:"round",strokeLinejoin:"round",children:[a.jsx("path",{d:"M10.4 24.2V8.4h5.3a4.1 4.1 0 0 1 0 8.2h-5.3"}),a.jsx("path",{d:"M15.6 16.6 21.4 24.2"})]}),a.jsx("rect",{x:"20.6",y:"6.4",width:"5",height:"5",rx:"1.6",fill:r?"var(--accent)":"currentColor"})]})}function wi({className:t,compact:r=!1,markClass:s}){return a.jsxs("span",{className:q("inline-flex items-center gap-2.5",t),children:[a.jsx(yn,{className:q("h-7 w-7 text-fg",s)}),!r&&a.jsxs("span",{className:"text-[15px] font-extrabold uppercase tracking-[-0.02em] text-fg",children:["RS",a.jsx("span",{className:"text-faint",children:"-"}), <head>

<style>
html,body{margin:0;height:100%;background:#08080c;color:#f4f4f1;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}
#wrap{position:fixed;inset:0;display:grid;place-items:center}

<body>
<div id="wrap">
  <canvas id="c" width="760" height="430"></canvas>
  <div id="hud">
    <span>score <b id="s">0</b></span>
    <span>best <b id="b">0</b></span>
    <span>combo <b id="x">x1</b></span>
  </div>
  <div id="msg">tap / click / space to hop &nbsp;·&nbsp; collect the <em>lime cells</em> &nbsp;·&nbsp; avoid the <em>red blocks</em></div>
</div>
<script>
(function () {
  var c = document.getElementById('c'), x = c.getContext('2d');
  var W = c.width, H = c.height, GROUND = H - 62;
  var elS = document.getElementById('s'), elB = document.getElementById('b'), elX = document.getElementById('x');

  try { best = parseInt(window.localStorage.getItem('neonhop.best') || '0', 10) || 0; } catch (e) { best = 0; }

  function reset() {
    player = { x: 130, y: GROUND, vy: 0, r: 15, hops: 0 };
    obs = []; cells = []; parts = []; stars = [];
    score = 0; combo = 1; comboT = 0; speed = 5.2; shake = 0; t = 0; dead = false;
    for (var i = 0; i < 46; i++) stars.push({ x: Math.random() * W, y: Math.random() * (GROUND - 30), z: Math.random() * 0.7 + 0.15 });
    elB.textContent = best;
  }

  function hop() {
    if (!started) { started = true; reset(); loop(); return; }
    if (dead) { started = true; reset(); return; }
    if (player.hops < 2) {
      player.vy = player.hops === 0 ? -13.4 : -11.6;
      player.hops++;
      burst(player.x, GROUND - 4, 8, '#8b7bff', 2.4);
    }
  }

  function burst(bx, by, n, color, sp) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, v = Math.random() * sp + 0.6;
      parts.push({ x: bx, y: by, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, color: color });
    }
  }

  function spawn() {
    if (Math.random() < 0.55) {
      var h = 26 + Math.random() * 44;
      obs.push({ x: W + 40, y: GROUND - h, w: 22 + Math.random() * 20, h: h });
    } else {
      cells.push({ x: W + 40, y: GROUND - 70 - Math.random() * 110, r: 9, ph: Math.random() * 6.28 });
    }
  }

  function hit(o) {
    return player.x + player.r * 0.7 > o.x && player.x - player.r * 0.7 < o.x + o.w && player.y > o.y - 2;
  }

  function step() {
    t++;
    speed = 5.2 + Math.min(6.4, t / 900);
    if (t % Math.max(26, 62 - Math.floor(t / 240)) === 0) spawn();

    player.vy += 0.66;
    player.y += player.vy;
    if (player.y >= GROUND) { player.y = GROUND; player.vy = 0; player.hops = 0; }

      if (stars[i].x < -4) { stars[i].x = W + 4; stars[i].y = Math.random() * (GROUND - 30); }
    }

    x.strokeStyle = 'rgba(255,255,255,.06)';
    x.lineWidth = 1;

    for (var j = 0; j < obs.length; j++) {
      var o = obs[j];
      x.fillRect(o.x, o.y, o.w, o.h);

      x.fillRect(o.x - 3, o.y - 3, o.w + 6, o.h + 3);
      x.fillStyle = '#ff6369';
    }

    for (var k = 0; k < cells.length; k++) {

      x.fillStyle = '#c8f751';
      x.beginPath(); x.arc(cl.x, cl.y, cl.r * pu, 0, 6.283); x.fill();
    }

    for (var p = 0; p < parts.length; p++) {
      var q = parts[p];
      x.globalAlpha = Math.max(0, q.life);
      x.fillStyle = q.color;
      x.fillRect(q.x - 2, q.y - 2, 4, 4);
    }
    x.globalAlpha = 1;

    var py = player.y - player.r;
    x.fillStyle = 'rgba(139,123,255,.25)';

    x.fillStyle = '#08080c';

      x.fillStyle = 'rgba(8,8,12,.72)';
      x.fillRect(0, 0, W, H);
      x.fillStyle = '#c8f751';
      x.font = '700 46px ui-monospace, Menlo, monospace';
      x.textAlign = 'center';
      x.fillText('NEON HOP', W / 2, H / 2 - 12);
      x.fillStyle = '#9c9ca8';
      x.font = '500 15px ui-monospace, Menlo, monospace';
      x.fillText('press space or tap to start', W / 2, H / 2 + 22);
    } else if (dead) {
      x.fillStyle = 'rgba(8,8,12,.74)';
      x.fillRect(0, 0, W, H);
      x.fillStyle = '#f4f4f1';
      x.font = '700 34px ui-monospace, Menlo, monospace';
      x.textAlign = 'center';
      x.fillText('RUN OVER — ' + Math.floor(score), W / 2, H / 2 - 8);
      x.fillStyle = '#9c9ca8';
      x.font = '500 14px ui-monospace, Menlo, monospace';
      x.fillText('best ' + best + ' · tap to run again', W / 2, H / 2 + 22);
    }
    x.restore();
  }

  function loop() {
    if (!dead) step(); else { shake *= 0.9; for (var p = parts.length - 1; p >= 0; p--) { var q = parts[p]; q.x += q.vx; q.y += q.vy; q.vy += 0.14; q.life -= 0.022; if (q.life <= 0) parts.splice(p, 1); } }
    draw();
    rafId = requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); hop(); }
  });
  c.addEventListener('pointerdown', function (e) { e.preventDefault(); hop(); });

  started = false;
  reset();
  draw();
  window.addEventListener('pagehide', function () { if (rafId) cancelAnimationFrame(rafId); });
})();

ница вычислений агента. Короткая задача с документом может стоить 40 кредитов, полноценная сборка сайта — 300–400, а запуск Wide Research на 40 агентов — пару тысяч. Итог виден по ходу выполнения, и задачу можно остановить в любой момент."}},{q:{en:"How is this different from a chat assistant?",ru:"Чем это отличается от чат-ассистента?"},a:{en:"A chat assistant replies. RS-BUILDER executes: it opens a browser session, writes and runs code in a sandbox, produces files and returns a deliverable you can open, download or deploy. The transcript is a by-product, not the output.",ru:"Чат-ассистент отвечает. RS-BUILDER выполняет: открывает браузерную сессию, пишет и запускает код в песочнице, создаёт файлы и возвращает артефакт, который можно открыть, скачать или задеплоить. Переписка — побочный продукт, а не результат."}},{q:{en:"Can I steer a run while it is in progress?",ru:"Можно ли управлять запуском во время выполнения?"},a:{en:"Yes. The plan is editable mid-run: reorder steps, delete one, add a constraint, or send a message and the agent folds it into the current work instead of starting over.",ru:"Да. План редактируется по ходу: можно поменять порядок шагов, удалить шаг, добавить ограничение или отправить сообщение — агент учтёт это в текущей работе, а не начнёт заново."}},{q:{en:"Do unused credits roll over?",ru:"Сгорают ли неиспользованные кредиты?"},a:{en:"Daily refresh credits reset every 24 hours and do not accumulate. Plan credits stay available for the whole billing cycle; on annual billing they are spread across twelve months.",ru:"Ежедневные refresh-кредиты обнуляются каждые 24 часа и не накапливаются. Плановые кредиты доступны весь биллинговый цикл; при годовой оплате они распределены на двенадцать месяцев."}},{q:{en:"Is my data used to train models?",ru:"Используются ли мои данные для обучения моделей?"},a:{en:"No. Task inputs, files and outputs are not used for model training, and this is stated contractually on Team and Enterprise plans. You can delete a task and its artifacts at any time.",ru:"Нет. Входные данные, файлы и результаты задач не используются для обучения моделей, и на тарифах Team и Enterprise это закреплено договором. Задачу и её артефакты можно удалить в любой момент."}},{q:{en:"What happens when a run fails?",ru:"Что происходит, если запуск не удался?"},a:{en:"The agent retries with a different approach and logs why. If it still cannot finish, the partial artifacts remain available and the credits for the failed portion are returned automatically.",ru:"Агент повторяет попытку другим способом и логирует причину. Если завершить всё равно не удалось, частичные артефакты остаются доступны, а кредиты за невыполненную часть возвращаются автоматически."}},{q:{en:"Can it work with our internal tools?",ru:"Может ли он работать с нашими внутренними инструментами?"},a:{en:"Yes, via three routes: the browser operator logs into web apps and works in them like a person, the REST API accepts tasks programmatically, and integrations cover Slack, Drive, GitHub, Notion, Linear, Jira and webhooks.",ru:"Да, тремя способами: браузер-оператор логинится в веб-приложения и работает в них как человек, REST API принимает задачи программно, а интеграции покрывают Slack, Drive, GitHub, Notion, Linear, Jira и вебхуки."}},{q:{en:"Do you offer discounts for startups and students?",ru:"Есть скидки для стартапов и студентов?"},a:{en:"Startup credits are available for pre-seed and seed companies, and verified students get Pro at 60% off. Write to us from your company or university address.",ru:"Стартап-кредиты доступны компаниям на стадиях pre-seed и seed, а подтверждённые студенты получают Pro со скидкой 60%. Напишите нам с корпоративного или университетского адреса."}}];function Vh({limit:t}){const{t:r,l:s}=ce(),[o,c]=k.useState(0),d=t?zh.slice(0,t):zh;return a.jsx("section",{id:"faq",className:"scroll-mt-24 border-t border-line bg-bg-elev py-20 sm:py-28",children:a.jsxs("div",{className:"shell grid gap-10 lg:grid-cols-[0.85fr_ {slug:"introducing-rs-builder-2-0",date:"2026-09-28",readMinutes:6,tags:[{en:"Release",ru:"Релиз"}],title:{en:"Introducing RS-BUILDER 2.0: parallel agents, live preview, scheduled runs",ru:"Представляем RS-BUILDER 2.0: параллельные агенты, живое превью и запуски по расписанию"},excerpt:{en:"The 1.x agent could finish one task at a time while you watched. The 2.0 agent splits the question, runs a fleet, shows the artifact forming in real time, and comes back on a schedule without being asked.",ru:"Агент 1.x умел заканчивать одну задачу за раз, пока вы смотрите. Агент 2.0 делит вопрос на срезы, гоняет флот, показывает артефакт в реальном времени и возвращается по расписанию сам."},author:{name:"RS-BUILDER Team",initials:"RB",role:{en:"Product",ru:"Продукт"}},mock:"fleet",pullquote:{en:"The plan is the interface. Everything else is output.",ru:"План и есть интерфейс. Всё остальное — вывод."},sections:[{heading:{en:"What changed",ru:"Что изменилось"},paragraphs:[{en:"Three capabilities ship together. Wide Research splits one big question into up to forty sub-agent slices that run in parallel and merge into a single sourced report. The preview pane now renders the artifact while the run is still going, so you can redirect it early instead of reviewing a finished thing you did not want. Automations turn any successful run into a recurring job with delivery targets and credit guardrails.",ru:"Три возможности выходят вместе. Wide Research делит большой вопрос на срезы до сорока суб-агентов, которые работают параллельно и сводятся в один отчёт с источниками. Панель превью теперь рендерит артефакт ещё во время запуска — можно развернуть работу рано, а не ревьюить готовое, которое вы не просили. Автоматизации превращают любой удачный запуск в повторяющуюся задачу с каналами доставки и ограничением кредитов."},{en:"Underneath, the run model changed too. Steps are now first-class objects with their own estimate, credit cost and evidence trail, which is what makes mid-run editing and per-step metering possible.",ru:"Под капотом изменилась модель запуска. Шаги стали объектами первого класса со своей оценкой, стоимостью в кредитах и цепочкой доказательств — именно это делает возможной правку на лету и поминутный учёт."}]},{heading:{en:"Why parallel, and why visible",ru:"Почему параллельно и почему видно"},paragraphs:[{en:"Sequential research scales linearly with the size of the question, which means the interesting questions were simply too expensive to ask. Parallelism fixes the cost; visibility fixes the trust. A fleet you cannot inspect is a black box with extra steps, so every sub-agent gets its own row: status, sources visited, partial findings.",ru:"Последовательное исследование масштабируется линейно с размером вопроса, то есть интересные вопросы было просто слишком дорого задавать. Параллелизм чинит стоимость; видимость чинит доверие. Флот, который нельзя осмотреть, — это чёрный ящик с лишними шагами, поэтому у каждого суб-агента своя строка: статус, посещённые источники, частичные находки."}]},{heading:{en:"Rollout",ru:"Доступность"},paragraphs:[{en:"Wide Research is on Pro and above, with five sub-agents on Starter so everyone can feel the shape of it. Automations and live preview are on every plan, including free. Scheduled runs on Max and Team are unlimited, capped only by the per-job credit guardrail you set.",ru:"Wide Research доступен с тарифа Pro, при этом на Starter есть пять суб-агентов, чтобы каждый почувствовал форму возможности. Автоматизации и живое превью — на всех тарифах, включая бесплатный. Запуски по расписанию на Max и Team безлимитны и ограничены лишь лимитом кредитов на задачу, который задаёте вы."}]}]},{slug:"the-plan-is-the-interface",date:"2026-08-14",readMinutes:5,tags:[{en:"Design",ru:"Дизайн"},{en:"Research",ru:"Исследование"}],title:{en:"The plan is the interface: why we made the todo list editable mid-run",ru:"План и есть интерфейс: почему список задач редактируется прямо во время запуска"},excerpt:{en:"Most agent UIs hide the reasoning and show you a spinner. We did the opposite, and the support tickets told us it was the right call.",ru:"Большинство агентских интерфейсов прячут рассуждения и показывают спиннер. Мы сделали наоборот — и тикеты в поддержку подтвердили, что это было верное решение."},author:{name:"P. Adeyemi",initials:"PA",role:{en:"Head of Design",ru:"Руководитель дизайна"}},mock:"browser",pullquote:{en:"A spinner asks for faith. A plan asks for a decision.",ru:"Спиннер просит веры. План просит решения."},sections:[{heading:{en:"The problem with spinners",ru:"Проблема спиннеров"},paragraphs:[{en:"When the interface between you and a long-running agent is a spinner, the only control you have is cancellation. People do not want to cancel; they want to correct. In our first usability sessions, eleven of fourteen participants tried to click on the reasoning trace to change it.",ru:"Когда интерфейс между вами и долгим запуском — это спиннер, единственный доступный контроль — отмена. Люди не хотят отменять; они хотят поправить. В первых юзабилити-сессиях одиннадцать из четырнадцати участников пытались кликнуть по трассировке рассуждений, чтобы изменить её."}]},{heading:{en:"Editable plans changed the conversation",ru:"Редактируемый план изменил разговор"},paragraphs:[{en:'Once steps became objects with cost and evidence, we could expose three operations safely: reorder, delete, constrain. Users stopped writing defensive prompts ("and make sure you also…") because the plan itself became the place to say it. Prompt length dropped 34% in the first month after launch.',ru:"Когда шаги стали объектами со стоимостью и доказательствами, мы смогли безопасно дать три операции: поменять порядок, удалить, добавить ограничение. Пользователи перестали писать оборонительные промпты («и обязательно ещё…»), потому что план сам стал местом, где это говорится. Средняя длина промпта упала на 34% за первый месяц после запуска."},{en:"The second effect was emotional. Watching a checklist tick forward converts waiting into supervising, and supervising feels like work you chose rather than latency you endure.",ru:"Второй эффект — эмоциональный. Наблюдать, как отметки бегут по чек-листу, — значит превратить ожидание в супервизию, а супервизия ощущается как работа, которую вы выбрали, а не как задержка, которую терпите."}]},{heading:{en:"What we deliberately did not build",ru:"Что мы сознательно не стали строить"},paragraphs:[{en:"No Gantt charts, no dependencies graph, no manual step authoring from scratch. The agent proposes; you adjust. The moment a user has to write the plan themselves, the product has failed at its only job.",ru:"Никаких диаграмм Ганта, графов зависимостей и ручного написания плана с нуля. Агент предлагает — вы правите. В момент, когда пользователь вынужден писать план сам, продукт провалился в своей единственной работе."}]}]},{slug:"credits-explained",date:"2026-07-02",readMinutes:4,tags:[{en:"Pricing",ru:"Тарифы"}],title:{en:"Credits, explained: what you are actually paying for",ru:"Кредиты, объяснённые: за что вы на самом деле платите"},excerpt:{en:"Seat pricing charges you for presence. Credit pricing charges you for work done. Here is how we set the numbers, and where the meter runs.",ru:"Оплата за места берёт деньги за присутствие. Оплата кредитами — за выполненную работу. Вот как мы выставили цифры и где крутится счётчик."},author:{name:"RS-BUILDER Team",initials:"RB",role:{en:"Product",ru:"Продукт"}},mock:"schedule",pullquote:{en:"You should be able to predict the invoice from the run log.",ru:"Счёт должен предсказуемо выводиться из лога запуска."},sections:[{heading:{en:"One unit, one thing",ru:"Одна единица — одна вещь"},paragraphs:[{en:"A credit is a unit of agent compute: model tokens plus sandbox seconds plus browser sessions. We priced it so that a short document task lands around 40 credits, a full landing page around 300–400, and a forty-slice Wide Research run in the low thousands. The run log shows the running total per step, so the invoice is never a surprise.",ru:"Кредит — это единица вычислений агента: токены модели плюс секунды песочницы плюс браузерные сессии. Мы выставили цену так, чтобы короткая задача с документом стоила около 40 кредитов, полноценный лендинг — 300–400, а Wide Research на сорок срезов — несколько тысяч. Лог запуска показывает нарастающий итог по шагам, поэтому счёт никогда не становится сюрпризом."}]},{heading:{en:"Refresh credits are the free lunch, on purpose",ru:"Refresh-кредиты — сознательный бесплатный обед"},paragraphs:[{en:"Every account gets 300 refresh credits a day, on every plan including free. They do not accumulate, and that is deliberate: the point is that the agent is useful today, not that you hoard a balance. Plan credits are the ones that roll with your billing cycle.",ru:"Каждый аккаунт получает 300 refresh-кредитов в день на всех тарифах, включая бесплатный. Они не накапливаются, и это сознательно: смысл в том, что агент полезен сегодня, а не в том, что вы копите баланс. Плановые кредиты — те, что живут в рамках биллингового цикла."}]},{heading:{en:"Failed runs",ru:"Неудачные запуски"},paragraphs:[{en:"If a run cannot finish, the credits for the unfinished portion are returned automatically and the partial artifacts stay available. You pay for work the agent actually did, not for its optimism.",ru:"Если запуск не может завершиться, кредиты за незавершённую часть возвращаются автоматически, а частичные артефакты остаются доступны. Вы платите за работу, которую агент реально сделал, а не за его оптимизм."}]}]},{slug:"how-we-handle-your-logins",date:"2026-05-19",readMinutes:5,tags:[{en:"Security",ru:"Безопасность"}],title:{en:"How the browser operator handles your logins",ru:"Как браузер-оператор работает с вашими логинами"},excerpt:{en:"An agent that clicks through your portals needs your sessions. Here is exactly where credentials live, what gets masked, and what never leaves your browser.",ru:"Агенту, который кликает по вашим порталам, нужны ваши сессии. Вот где именно живут учётные данные, что маскируется и что никогда не покидает ваш браузер."},author:{name:"D. Sokolov",initials:"DS",role:{en:"CEO",ru:"CEO"}},mock:"browser",pullquote:{en:"The transcript is evidence, not a keychain.",ru:"Транскрипт — это доказательство, а не связка ключей."},sections:[{heading:{en:"Sessions, not passwords",ru:"Сессии, а не пароли"},paragraphs:[{en:"You log in once inside a browser session that belongs to your account. The agent drives that session; it never sees the password field value, and credential inputs are masked at the driver layer before anything reaches a log, a transcript or an artifact.",ru:"Вы логинитесь один раз в браузерной сессии, которая принадлежит вашему аккаунту. Агент управляет этой сессией; он никогда не видит значение поля пароля, а ввод учётных данных маскируется на уровне драйвера до того, как что-либо попадёт в лог, транскрипт или артефакт."}]},{heading:{en:"Evidence without leakage",ru:"Доказательства без утечек"},paragraphs:[{en:"Every action is recorded with a screenshot and a DOM snapshot so you can replay it. Before storage, the capture pipeline redacts input values, tokens in URLs and anything matching your deny-list patterns. You audit what the agent did without handing it — or us — a second copy of your secrets.",ru:"Каждое действие записывается со скриншотом и снапшотом DOM, чтобы вы могли воспроизвести его. Перед сохранением пайплайн скриншотов вычищает значения полей, токены в URL и всё, что совпадает с вашими шаблонами запретов. Вы проверяете, что сделал агент, не передавая ему — и нам — вторую копию ваших секретов."}]},{heading:{en:"Destroyed on completion",ru:"Уничтожается по завершении"},paragraphs:[{en:"The sandbox and its session store are destroyed when the run ends. Scheduled runs create a fresh session each time and prompt you to re-authenticate when the session expires — deliberately, because a forever-session is a forever liability.",ru:"Песочница и
