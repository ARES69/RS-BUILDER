    <script>
      // Apply persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('rsb-theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var dark = stored ? stored === 'dark' : !prefersLight;
          document.documentElement.classList.toggle('dark', dark);
          var lang = localStorage.getItem('rsb-locale');
          if (lang) document.documentElement.lang = lang;
        } catch (e) {}
      })();

<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ember &amp; Oak — single-origin coffee, on repeat</title>
<style>
:root{--paper:#f7f2ea;--card:#fffdf9;--ink:#241c15;--muted:#7a6a5b;--ember:#c2571b;--leaf:#5d7a4a;--line:rgba(36,28,21,.14)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.62 ui-serif,Georgia,'Times New Roman',serif}
h1,h2,h3,.sans{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:0 22px}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 0;border-bottom:1px solid var(--line)}
.mark{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ember);box-shadow:0 0 0 4px rgba(194,87,27,.16)}
nav a{margin-left:20px;color:var(--muted);text-decoration:none;font-size:14px}
.btn{display:inline-block;background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:999px;text-decoration:none;font:600 14px/1 ui-sans-serif,system-ui,sans-serif;border:0;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.hero{padding:74px 0 56px;display:grid;gap:18px}
.eyebrow{font:600 12px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--ember)}
h1{font-size:clamp(38px,6.4vw,68px);line-height:1.02;letter-spacing:-.035em;margin:0;max-width:16ch}
.lede{font-size:19px;color:var(--muted);max-width:52ch;margin:0}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.beans{display:flex;gap:8px;margin-top:26px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font:500 12.5px/1 ui-sans-serif,system-ui,sans-serif;color:var(--muted)}
section{padding:52px 0;border-top:1px solid var(--line)}
h2{font-size:clamp(26px,3.4vw,36px);letter-spacing:-.03em;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 28px;max-width:56ch}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.plan{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:10px}
.plan.best{border-color:var(--ink);box-shadow:0 18px 40px -28px rgba(36,28,21,.6)}
.price{font:800 34px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:-.03em}
.price span{font:500 13px/1 ui-sans-serif,system-ui,sans-serif;color:var(--muted);letter-spacing:0}
ul{margin:0;padding-left:18px;color:var(--muted);font-size:14.5px}
li{margin:5px 0}
.tag{align-self:flex-start;background:rgba(93,122,74,.14);color:var(--leaf);border-radius:999px;padding:4px 10px;font:600 11px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}
details{border-bottom:1px solid var(--line);padding:14px 0}
summary{cursor:pointer;font:600 16px/1.4 ui-sans-serif,system-ui,sans-serif}
details p{color:var(--muted);margin:10px 0 0;font-size:15px}
footer{border-top:1px solid var(--line);padding:28px 0 46px;color:var(--muted);font-size:13.5px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.stat{display:flex;gap:26px;flex-wrap:wrap;margin-top:6px}
.stat div{font:600 13px/1.5 ui-sans-serif,system-ui,sans-serif;color:var(--muted)}
.stat b{display:block;font-size:24px;color:var(--ink);letter-spacing:-.02em}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark"><span class="dot"></span> Ember &amp; Oak</div>
    <nav class="sans">
      <a href="#plans">Plans</a><a href="#how">How it works</a><a href="#faq">FAQ</a>
      <a class="btn" href="#plans" style="margin-left:20px">Start a subscription</a>
    </nav>
  </header>

  <div class="hero">
    <span class="eyebrow">Roasted to order · shipped within 48h</span>
    <h1>One origin at a time, until you have tasted them all.</h1>
    <p class="lede">A rotating subscription of single-origin lots from smallholder farms. We roast the day your box ships, and we tell you exactly who grew it.</p>
    <div class="actions"><a class="btn" href="#plans">Choose a plan</a><a class="btn alt" href="#how">How it works</a></div>
    <div class="beans">
      <span class="chip">Ethiopia · Guji</span><span class="chip">Colombia · Huila</span>
      <span class="chip">Kenya · Nyeri</span><span class="chip">Peru · Cajamarca</span>
    </div>
  </div>

  <section id="plans">
    <h2>Plans</h2>
    <p class="sub">Pause, skip or swap any week. Every plan includes tasting notes and the farmer's story.</p>
    <div class="grid">
      <div class="plan">
        <span class="tag">Solo</span>
        <div class="price">14€ <span>/ month</span></div>
        <p class="sub" style="margin:0">250 g, one origin, every month.</p>
        <ul><li>Whole bean or ground</li><li>Free shipping over 20€</li><li>Cancel anytime</li></ul>
        <a class="btn alt" href="#" style="margin-top:auto;text-align:center">Start solo</a>
      </div>
      <div class="plan best">
        <span class="tag">Explorer · most picked</span>
        <div class="price">29€ <span>/ month</span></div>
        <p class="sub" style="margin:0">Two 250 g bags, two origins, every month.</p>
        <ul><li>Everything in Solo</li><li>Early access to micro-lots</li><li>Brew guide matched to the lot</li><li>Free shipping, always</li></ul>
        <a class="btn" href="#" style="margin-top:auto;text-align:center">Start exploring</a>
      </div>
      <div class="plan">
        <span class="tag">House</span>
        <div class="price">69€ <span>/ month</span></div>
        <p class="sub" style="margin:0">1 kg for a busy household or small office.</p>
        <ul><li>Everything in Explorer</li><li>Two origins per shipment</li><li>Equipment loan on request</li></ul>
        <a class="btn alt" href="#" style="margin-top:auto;text-align:center">Feed the house</a>
      </div>
    </div>
  </section>

  <section id="how">
    <h2>How it works</h2>
    <div class="grid">
      <div class="plan"><span class="tag">01</span><h3 style="margin:6px 0 0">Pick your rhythm</h3><p class="sub" style="margin:0">Weekly, fortnightly or monthly. Change it any time from your account.</p></div>
      <div class="plan"><span class="tag">02</span><h3 style="margin:6px 0 0">We roast to order</h3><p class="sub" style="margin:0">Nothing sits on a shelf. Your lot is roasted the morning it ships.</p></div>
      <div class="plan"><span class="tag">03</span><h3 style="margin:6px 0 0">Taste, rate, steer</h3><p class="sub" style="margin:0">Rate each bag and the next selection adjusts to what you actually drink.</p></div>
    </div>
    <div class="stat">
      <div><b>48h</b>from roast to courier</div>
      <div><b>31</b>partner farms</div>
      <div><b>4.8/5</b>average bag rating</div>
      <div><b>12k</b>subscribers</div>
    </div>
  </section>

  <section id="faq">
    <h2>Questions</h2>
    <details open><summary>Can I skip a month?</summary><p>Yes — skip, pause or cancel from the account page up to 48 hours before your roast date. No emails required.</p></details>
    <details><summary>Whole bean or ground?</summary><p>Both, per bag. If you choose ground we ask for your brew method and grind for it: V60, Aeropress, moka or espresso.</p></details>
    <details><summary>Where do you ship?</summary><p>EU, UK, Switzerland and Norway. Shipping is free on Explorer and House plans.</p></details>
    <details><summary>Do you wholesale?</summary><p>We do. Cafés and offices get a separate price list and a rotating guest lot every quarter.</p></details>
  </section>

  <footer>
    <span>© 2026 Ember &amp; Oak Roasters · Rotterdam</span>
    <span class="sans">Demo artifact generated by RS-BUILDER</span>
  </footer>

  <span class="kicker">Wide Research · 32 sub-agents · 418 sources</span>
  <h1>AI coding tools sold into the EU: landscape, pricing and compliance gaps</h1>
  <div class="meta">Prepared by RS-BUILDER · run time 21m 05s · 1,840 credits · 40 vendors profiled, 32 in scope for the EU market</div>

  <div class="callout">
    <strong>Executive summary.</strong> The EU-facing AI coding market splits into three groups: editor copilots competing on price, autonomous agents competing on task completion, and compliance-first platforms selling to regulated industries. Group three is the least crowded and carries the highest average contract value. Four concrete gaps are listed in section 5.
  </div>

  <h2>1. Scope and method</h2>
  <p>Thirty-two sub-agents each profiled one to two vendors using public pricing pages, documentation, EU customer references, procurement notices and, where available, published SOC 2 / ISO 27001 summaries. A second pass cross-checked every pricing claim against a live page visit; nine vendors had changed pricing in the previous 60 days.<sup><a href="#r4">4</a></sup></p>

  <h2>2. Market structure</h2>

      <tr><td>Compliance-first platform</td><td>4</td><td>145 €</td><td>18,600 €</td><td><span class="pill ok">Low</span></td></tr>
      <tr><td>Self-hosted / air-gapped</td><td>2</td><td>Custom</td><td>40,000 €+</td><td><span class="pill ok">Very low</span></td></tr>

  </table>

  <h2>3. Pricing patterns</h2>

    <li>Annual discounts cluster at 15–20%; three vendors offer no annual discount at all.</li>

      <tr><td>ISO 27001</td><td>14 / 32</td><td>Most common among vendors with public-sector customers</td></tr>
      <tr><td>Contractual no-training clause</td><td>18 / 32</td><td>Nine require an enterprise tier for it</td></tr>
      <tr><td>DPA available self-serve</td><td>9 / 32</td><td><span class="pill gap">Gap</span> most gate it behind sales</td></tr>
    </tbody>
  </table>

  <h2>5. Identified gaps</h2>
  <ol>
    <li><strong>Regulated mid-market.</strong> Banks under 5,000 employees and public health bodies want EU residency plus SSO without a 40k€ contract. Only two vendors serve this band credibly.</li>

<script>
(function () {
  var c = document.getElementById('c'), x = c.getContext('2d');

  function reset() {

    for (var i = 0; i < 46; i++) stars.push({ x: Math.random() * W, y: Math.random() * (GROUND - 30), z: Math.random() * 0.7 + 0.15 });

  }

  function hop() {
    if (!started) { started = true; reset(); loop(); return; }
    if (dead) { started = true; reset(); return; }
    if (player.hops < 2) {
      player.vy = player.hops === 0 ? -13.4 : -11.6;

 point.",ru:"Кредит — единица вычислений агента. Короткая задача с документом может стоить 40 кредитов, полноценная сборка сайта — 300–400, а запуск Wide Research на 40 агентов — пару тысяч. Итог виден по ходу выполнения, и задачу можно остановить в любой момент."}},{q:{en:"How is this different from a chat assistant?",ru:"Чем это отличается от чат-ассистента?"},a:{en:"A chat assistant replies. RS-BUILDER executes: it opens a browser session, writes and runs code in a sandbox, produces files and returns a deliverable you can open, download or deploy. The transcript is a by-product, not the output.",ru:"Чат-ассистент отвечает. RS-BUILDER выполняет: открывает браузерную сессию, пишет и запускает код в песочнице, создаёт файлы и возвращает артефакт, который можно открыть, скачать или задеплоить. Переписка — побочный продукт, а не результат."}},{q:{en:"Can I steer a run while it is in progress?",ru:"Можно ли управлять запуском во время выполнения?"},a:{en:"Yes. The plan is editable mid-run: reorder steps, delete one, add a constraint, or send a message and the agent folds it into the current work instead of starting over.",ru:"Да. План редактируется по ходу: можно поменять порядок шагов, удалить шаг, добавить ограничение или отправить сообщение — агент учтёт это в текущей работе, а не начнёт заново."}},{q:{en:"Do unused credits roll over?",ru:"Сгорают ли неиспользованные кредиты?"},a:{en:"Daily refresh credits reset every 24 hours and do not accumulate. Plan credits stay available for the whole billing cycle; on annual billing they are spread across twelve months.",ru:"Ежедневные refresh-кредиты обнуляются каждые 24 часа и не накапливаются. Плановые кредиты доступны весь биллинговый цикл; при годовой оплате они распределены на двенадцать месяцев."}},{q:{en:"Is my data used to train models?",ru:"Используются ли мои данные для обучения моделей?"},a:{en:"No. Task inputs, files and outputs are not used for model training, and this is stated contractually on Team and Enterpr .jsx(Mr,{})]})}const Bl=[{slug:"introducing-rs-builder-2-0",date:"2026-09-28",readMinutes:6,tags:[{en:"Release",ru:"Релиз"}],title:{en:"Introducing RS-BUILDER 2.0: parallel agents, live preview, scheduled runs",ru:"Представляем RS-BUILDER 2.0: параллельные агенты, живое превью и запуски по расписанию"},excerpt:{en:"The 1.x agent could finish one task at a time while you watched. The 2.0 agent splits the question, runs a fleet, shows the artifact forming in real time, and comes back on a schedule without being asked.",ru:"Агент 1.x умел заканчивать одну задачу за раз, пока вы смотрите. Агент 2.0 делит вопрос на срезы, гоняет флот, показывает артефакт в реальном времени и возвращается по расписанию сам."},author:{name:"RS-BUILDER Team",initials:"RB",role:{en:"Product",ru:"Продукт"}},mock:"fleet",pullquote:{en:"The plan is the interface. Everything else is output.",ru:"План и есть интерфейс. Всё остальное — вывод."},sections:[{heading:{en:"What changed",ru:"Что изменилось"},paragraphs:[{en:"Three capabilities ship together. Wide Research splits one big question into up to forty sub-agent slices that run in parallel and merge into a single sourced report. The preview pane now renders the artifact while the run is still going, so you can redirect it early instead of reviewing a finished thing you did not want. Automations turn any successful run into a recurring job with delivery targets and credit guardrails.",ru:"Три возможности выходят вместе. Wide Research делит большой вопрос на срезы до сорока суб-агентов, которые работают параллельно и сводятся в один отчёт с источниками. Панель превью теперь рендерит артефакт ещё во время запуска — можно развернуть работу рано, а не ревьюить готовое, которое вы не просили. Автоматизации превращают любой удачный запуск в повторяющуюся задачу с каналами доставки и ограничением кредитов."},{en:"Underneath, the run model changed too. Steps are now first-class objects with their own estimate, credit cost and evidence trail, which is what makes mid-run editing and per-step metering possible.",ru:"Под капотом изменилась модель запуска. Шаги стали объектами первого класса со своей оценкой, стоимостью в кредитах и цепочкой доказательств — именно это делает возможной правку на лету и поминутный учёт."}]},{heading:{en:"Why parallel, and why visible",ru:"Почему параллельно и почему видно"},paragraphs:[{en:"Sequential research scales linearly with the size of the question, which means the interesting questions were simply too expensive to ask. Parallelism fixes the cost; visibility fixes the trust. A fleet you cannot inspect is a black box with extra steps, so every sub-agent gets its own row: status, sources visited, partial findings.",ru:"Последовательное исследование масштабируется линейно с размером вопроса, то есть интересные вопросы было просто слишком дорого задавать. Параллелизм чинит стоимость; видимость чинит доверие. Флот, который нельзя осмотреть, — это чёрный ящик с лишними шагами, поэтому у каждого суб-агента своя строка: статус, посещённые источники, частичные находки."}]},{heading:{en:"Rollout",ru:"Доступность"},paragraphs:[{en:"Wide Research is on Pro and above, with five sub-agents on Starter so everyone can feel the shape of it. Automations and live preview are on every plan, including free. Scheduled runs on Max and Team are unlimited, capped only by the per-job credit guardrail you set.",ru:"Wide Research доступен с тарифа Pro, при этом на Starter есть пять суб-агентов, чтобы каждый почувствовал форму возможности. Автоматизации и живое превью — на всех тарифах, включая бесплатный. Запуски по расписанию на Max и Team безлимитны и ограничены лишь лимитом кредитов на задачу, который задаёте вы."}]}]},{slug:"the-plan-is-the-interface",date:"2026-08-14",readMinutes:5,tags:[{en:"Design",ru:"Дизайн"},{en:"Research",ru:"Исследование"}],title:{en:"The plan is the interface: why we made the todo list editable mid-run",ru:"План и есть интерфейс: почему список задач редактируется прямо во время запуска"},excerpt:{en:"Most agent UIs hide the reasoning and show you a spinner. We did the opposite, and the support tickets told us it was the right call.",ru:"Большинство агентских интерфейсов прячут рассуждения и показывают спиннер. Мы сделали наоборот — и тикеты в поддержку подтвердили, что это было верное решение."},author:{name:"P. Adeyemi",initials:"PA",role:{en:"Head of Design",ru:"Руководитель дизайна"}},mock:"browser",pullquote:{en:"A spinner asks for faith. A plan asks for a decision.",ru:"Спиннер просит веры. План просит решения."},sections:[{heading:{en:"The problem with spinners",ru:"Проблема спиннеров"},paragraphs:[{en:"When the interface between you and a long-running agent is a spinner, the only control you have is cancellation. People do not want to cancel; they want to correct. In our first usability sessions, eleven of fourteen participants tried to click on the reasoning trace to change it.",ru:"Когда интерфейс между вами и долгим запуском — это спиннер, единственный доступный контроль — отмена. Люди не хотят отменять; они хотят поправить. В первых юзабилити-сессиях одиннадцать из четырнадцати участников пытались кликнуть по трассировке рассуждений, чтобы изменить её."}]},{heading:{en:"Editable plans changed the conversation",ru:"Редактируемый план изменил разговор"},paragraphs:[{en:'Once steps became objects with cost and evidence, we could expose three operations safely: reorder, delete, constrain. Users stopped writing defensive prompts ("and make sure you also…") because the plan itself became the place to say it. Prompt length dropped 34% in the first month after launch.',ru:"Когда шаги стали объектами со стоимостью и доказательствами, мы смогли безопасно дать три операции: поменять порядок, удалить, добавить ограничение. Пользователи перестали писать оборонительные промпты («и обязательно ещё…»), потому что план сам стал местом, где это говорится. Средняя длина промпта упала на 34% за первый месяц после запуска."},{en:"The second effect was emotional. Watching a checklist tick forward converts waiting into supervising, and supervising feels like work you chose rather than latency you endure.",ru:"Второй эффект — эмоциональный. Наблюдать, как отметки бегут по чек-листу, — значит превратить ожидание в супервизию, а супервизия ощущается как работа, которую вы выбрали, а не как задержка, которую терпите."}]},{heading:{en:"What we deliberately did not build",ru:"Что мы сознательно не стали строить"},paragraphs:[{en:"No Gantt charts, no dependencies graph, no manual step authoring from scratch. The agent proposes; you adjust. The moment a user has to write the plan themselves, the product has failed at its only job.",ru:"Никаких диаграмм Ганта, графов зависимостей и ручного написания плана с нуля. Агент предлагает — вы правите. В момент, когда пользователь вынужден писать план сам, продукт провалился в своей единственной работе."}]}]},{slug:"credits-explained",date:"2026-07-02",readMinutes:4,tags:[{en:"Pricing",ru:"Тарифы"}],title:{en:"Credits, explained: what you are actually paying for",ru:"Кредиты, объяснённые: за что вы на самом деле платите"},excerpt:{en:"Seat pricing charges you for presence. Credit pricing charges you for work done. Here is how we set the numbers, and where the meter runs.",ru:"Оплата за места берёт деньги за присутствие. Оплата кредитами — за выполненную работу. Вот как мы выставили цифры и где крутится счётчик."},author:{name:"RS-BUILDER Team",initials:"RB",role:{en:"Product",ru:"Продукт"}},mock:"schedule",pullquote:{en:"You should be able to predict the invoice from the run log.",ru:"Счёт должен предсказуемо выводиться из лога запуска."},sections:[{heading:{en:"One unit, one thing",ru:"Одна единица — одна вещь"},paragraphs:[{en:"A credit is a unit of agent compute: model tokens plus sandbox seconds plus browser sessions. We priced it so that a short document task lands around 40 credits, a full landing page around 300–400, and a forty-slice Wide Research run in the low thousands. The run log shows the running total per step, so the invoice is never a surprise.",ru:"Кредит — это единица вычислений агента: токены модели плюс секунды песочницы плюс браузерные сессии. Мы выставили цену так, чтобы короткая задача с документом стоила около 40 кредитов, полноценный лендинг — 300–400, а Wide Research на сорок срезов — несколько тысяч. Лог запуска показывает нарастающий итог по шагам, поэтому счёт никогда не становится сюрпризом."}]},{heading:{en:"Refresh credits are the free lunch, on purpose",ru:"Refresh-кредиты — сознательный бесплатный обед"},paragraphs:[{en:"Every account gets 300 refresh credits a day, on every plan including free. They do not accumulate, and that is deliberate: the point is that the agent is useful today, not that you hoard a balance. Plan credits are the ones that roll with your billing cycle.",ru:"Каждый аккаунт получает 300 refresh-кредитов в день на всех тарифах, включая бесплатный. Они не накапливаются, и это сознательно: смысл в том, что агент полезен сегодня, а не в том, что вы копите баланс. Плановые кредиты — те, что живут в рамках биллингового цикла."}]},{heading:{en:"Failed runs",ru:"Неудачные запуски"},paragraphs:[{en:"If a run cannot finish, the credits for the unfinished portion are returned automatically and the partial artifacts stay available. You pay for work the agent actually did, not for its optimism.",ru:"Если запуск не может завершиться, кредиты за незавершённую часть возвращаются автоматически, а частичные артефакты остаются доступны. Вы платите за работу, которую агент реально сделал, а не за его оптимизм."}]}]},{slug:"how-we-handle-your-logins",date:"2026-05-19",readMinutes:5,tags:[{en:"Security",ru:"Безопасность"}],title:{en:"How the browser operator handles your logins",ru:"Как браузер-оператор работает с вашими логинами"},excerpt:{en:"An agent that clicks through your portals needs your sessions. Here is exactly where credentials live, what gets masked, and what never leaves your browser.",ru:"Агенту, который кликает по вашим порталам, нужны ваши сессии. Вот где именно живут учётные данные, что маскируется и что никогда не покидает ваш браузер."},author:{name:"D. Sokolov",initials:"DS",role:{en:"CEO",ru:"CEO"}},mock:"browser",pullquote:{en:"The transcript is evidence, not a keychain.",ru:"Транскрипт — это доказательство, а не связка ключей."},sections:[{heading:{en:"Sessions, not passwords",ru:"Сессии, а не пароли"},paragraphs:[{en:"You log in once inside a browser session that belongs to your account. The agent drives that session; it never sees the password field value, and credential inputs are masked at the driver layer before anything reaches a log, a transcript or an artifact.",ru:"Вы логинитесь один раз в браузерной сессии, которая принадлежит вашему аккаунту. Агент управляет этой сессией; он никогда не видит значение поля пароля, а ввод учётных данных маскируется на уровне драйвера до того, как что-либо попадёт в лог, транскрипт или артефакт."}]},{heading:{en:"Evidence without leakage",ru:"Доказательства без утечек"},paragraphs:[{en:"Every action is recorded with a screenshot and a DOM snapshot so you can replay it. Before storage, the capture pipeline redacts input values, tokens in URLs and anything matching your deny-list patterns. You audit what the agent did without handing it — or us — a second copy of your secrets.",ru:"Каждое действие записывается со скриншотом и снапшотом DOM, чтобы вы могли воспроизвести его. Перед сохранением пайплайн скриншотов вычищает значения полей, токены в URL и всё, что совпадает с вашими шаблонами запретов. Вы проверяете, что сделал агент, не передавая ему — и нам — вторую копию ваших секретов."}]},{heading:{en:"Destroyed on completion",ru:"Уничтожается по завершении"},paragraphs:[{en:"The sandbox and its session store are destroyed when the run ends. Scheduled runs create a fresh session each time and prompt you to re-authenticate when the session expires — deliberately, because a forever-session is a forever liability.",ru:"Песочница и её хранилище сессий уничтожаются по завершении запуска. Запуски по расписанию каждый раз создают свежую сессию и просят вас повторно авторизоваться, когда сессия истекает, — сознательно, потому что вечная сессия есть вечная ответственность."}]}]}],lj=t=>Bl.find(r=>r.slug===t);function Gi({children:t,tone:r="neutral",className:s}){const o={neutral:"bg-surface-2 text-muted border-line",accent:"bg-accent/15 text-accent border-accent/30",violet:"bg-violet/15 text-violet border-violet/30",outline:"bg-transparent text-fg border-line-strong"};return a.jsx("span",{className:q("inline-flex items-center gap-1.5 rounded-full border px-2.5 py-1 text-[11px] font-semibold uppercase tracking-[0.12em]",o[r],s),children:t})}function Wh(t,r){return new Date(t+"T00:00:00Z").toLocaleDateString(r==="ru"?"ru-RU":"en-GB",{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"})}function cj({slug:t,date:r,readMinutes:s,tags:o,title:c,excerpt:d,author:p,mock:h}){const{l:m,locale:g}=ue();return a.jsxs(De,{to:"/blog/"+t,className:"group flex h-full flex-col overflow-hidden rounded-2xl border border-line bg-surface/60 transition-all duration-300 hover:-translate-y-1 hover:border-accent/35",children:[a.jsx("div",{className:"relative overflow-hidden border-b border-line bg-bg-elev p-4",children:a.jsx("div",{className:"transition-transform duration-500 group-hover:scale-[1.02]",children:a.jsx(Ct,{kind:h,animate:!1})})}),a.jsxs("div",{className:"flex flex-1 flex-col p-5",children:[a.jsxs("div",{className:"flex flex-wrap items-center gap-2",children:[o.map(v=>a.jsx(Gi,{tone:"accent",children:m(v)},v.en)),a.jsxs("span",{className:"ml-auto inline-flex items-center gap-1.5 font-mono text-[11px] text-faint",children:[a.jsx(jo,{size:11})," ",s," min"]})]}),a.jsx("h3",{className:"mt-3 text-[16.5px] font-bold leading-snug tracking-[-0.02em] text-fg transition-colors group-hover:text-accent",children:m(c)}),a.jsx("p",{className:"mt-2 line-clamp-3 text-[13.5px] leading-relaxed te
